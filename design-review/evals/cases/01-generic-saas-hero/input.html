<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow page fixture</title>
  <style>
    :root {
      --ink: #151515;
      --paper: #fff;
      --gradient-start: #7c3aed;
      --gradient-end: #2563eb;
      --chip: #eee;
    }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Inter, sans-serif; }
    .hero { padding: 96px 24px; text-align: center; background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); }
    h1 { font: inherit; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px; }
    .card { padding: 24px; }
    .icon { display: inline-flex; padding: 12px; border-radius: 12px; background: var(--chip); }
    .action { transition: all 300ms; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p>SECTION 01</p>
      <h1>A place for your team's work</h1>
      <p>Tasks and reports in one place.</p>
      <button class="action" type="button">View tasks</button>
    </section>
    <section class="features" aria-label="Features">
      <article class="card"><span class="icon"><svg width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="6"/></svg></span><h2>Tasks</h2><p>See work assigned to you.</p></article>
      <article class="card"><span class="icon"><svg width="20" height="20" aria-hidden="true"><rect x="4" y="4" width="12" height="12"/></svg></span><h2>Reports</h2><p>Read the latest report.</p></article>
      <article class="card"><span class="icon"><svg width="20" height="20" aria-hidden="true"><path d="M2 18 L10 2 L18 18 Z"/></svg></span><h2>Files</h2><p>Find related documents.</p></article>
    </section>
  </main>
</body>
</html>
